<div class="auth-wrapper d-flex align-items-center justify-content-center vh-100" 
     style="background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
            url('https://wallpapers.com/images/hd/hair-salon-background-ocd8o0oatvbqyg39.jpg') no-repeat center center; 
            background-size: cover; position: relative;">
  
  <div class="card border-0 shadow-lg p-2" 
       style="width: 28rem; border-radius: 30px; 
              background: rgba(255, 255, 255, 0.95); 
              box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); z-index: 10;">
    
    <div class="card-body p-4">
      
      <div class="text-center mb-5">
        <div class="icon-box mb-2" style="font-size: 3.2rem; color: #d63384;">
          <i class="bi bi-stars"></i> 
        </div>
        <h2 class="fw-bold mb-1" style="color: #1a1a1a; letter-spacing: 2px;">GLAMOUR HUB</h2>
        <p class="small text-uppercase fw-bold" style="color: #d63384; letter-spacing: 1px;">Step into the world of beauty</p>
      </div>
      
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        
        <div class="form-floating mb-4 shadow-sm" style="border-radius: 12px; overflow: hidden; border: 1px solid #eee;">
          <input type="email" formControlName="email" class="form-control border-0 bg-white" id="emailInput" placeholder="name@example.com" style="color: #333;">
          <label for="emailInput" class="fw-bold" style="color: #555 !important; opacity: 1;">EMAIL ADDRESS</label>
          
          <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-danger small ms-3 mt-1">
            <i class="bi bi-exclamation-circle me-1"></i> Valid email is required.
          </div>
        </div>
        
        <div class="mb-4 position-relative shadow-sm" style="border-radius: 12px; overflow: hidden; border: 1px solid #eee;">
          <div class="form-floating">
            <input [type]="showPassword ? 'text' : 'password'" formControlName="password" class="form-control border-0 bg-white" id="passwordInput" placeholder="Password" style="color: #333; padding-right: 50px;">
            <label for="passwordInput" class="fw-bold" style="color: #555 !important; opacity: 1;">PASSWORD</label>
          </div>
          <span (click)="togglePassword()" class="position-absolute top-50 end-0 translate-middle-y me-3" style="cursor: pointer; z-index: 10;">
            <i [class]="showPassword ? 'bi bi-eye' : 'bi bi-eye-slash'" style="color: #d63384; font-size: 1.2rem;"></i>
          </span>
          
          <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-danger small ms-3 mt-1">
            <i class="bi bi-exclamation-circle me-1"></i> Minimum 6 characters required.
          </div>
        </div>
        
        <button class="btn w-100 py-3 mb-4 shadow-lg fw-bold text-uppercase text-white" 
                type="submit" 
                [disabled]="loginForm.invalid" 
                style="border-radius: 12px; letter-spacing: 2px; 
                       background: linear-gradient(45deg, #d63384, #ff85a1); 
                       border: none; transition: 0.3s ease;">
          Sign In
        </button>
        
        <div class="text-center">
          <small class="text-muted fw-bold">New here? 
            <a (click)="goToSignup()" 
               class="fw-bold text-decoration-none" 
               style="color: #d63384; cursor: pointer;">
               Create an Account
            </a>
          </small>
        </div>
      </form>

    </div>
  </div>
</div>
