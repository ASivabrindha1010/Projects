<div class="container-fluid p-5 bg-light" style="min-height: 100vh;">
  <div class="mb-4">
    <button class="btn btn-outline-dark rounded-pill px-4 shadow-sm fw-bold" routerLink="/admin-dashboard">
      <i class="bi bi-arrow-left me-2"></i> Back to Dashboard
    </button>
  </div>

  <div class="row g-4">
    <div class="col-md-5">
      <div class="card shadow border-0 p-4 rounded-4" style="background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);">
        <h4 class="fw-bold mb-4" style="color: #d63384;">Add New Item</h4>
        
        <form (ngSubmit)="addProduct()">
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">ITEM NAME</label>
            <input type="text" [(ngModel)]="newProduct.name" name="name" class="form-control rounded-pill border-0 bg-light px-3 py-2" placeholder="e.g. Herbal Shampoo" required>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">CATEGORY</label>
            <select [(ngModel)]="newProduct.category" name="category" class="form-select rounded-pill border-0 bg-light px-3 py-2">
              <option value="Products">Products (Oil, Shampoo, etc.)</option>
              <option value="Services">Services (Facial, Massage, etc.)</option>
            </select>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label small fw-bold text-muted">PRICE (₹)</label>
              <input type="number" [(ngModel)]="newProduct.price" name="price" class="form-control rounded-pill border-0 bg-light px-3 py-2" placeholder="499" required>
            </div>
            
            <div class="col-md-6 mb-3" *ngIf="newProduct.category === 'Products'">
              <label class="form-label small fw-bold text-muted">STOCK</label>
              <input type="number" [(ngModel)]="newProduct.stock" name="stock" class="form-control rounded-pill border-0 bg-light px-3 py-2" placeholder="50">
            </div>

            <div class="col-md-6 mb-3" *ngIf="newProduct.category === 'Services'">
              <label class="form-label small fw-bold text-muted">DURATION (MINS)</label>
              <input type="text" [(ngModel)]="newProduct.duration" name="duration" class="form-control rounded-pill border-0 bg-light px-3 py-2" placeholder="e.g. 60">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">IMAGE URL</label>
            <input type="text" [(ngModel)]="newProduct.image" name="image" class="form-control rounded-pill border-0 bg-light px-3 py-2" placeholder="Paste image address here...">
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">DESCRIPTION</label>
            <textarea [(ngModel)]="newProduct.description" name="description" class="form-control border-0 bg-light px-3 py-2" rows="2" style="border-radius: 15px;" placeholder="Details about the item..."></textarea>
          </div>

          <div class="preview-box border rounded-4 mb-4 d-flex align-items-center justify-content-center bg-white shadow-sm" style="height: 150px; overflow: hidden;">
            <img *ngIf="newProduct.image" [src]="newProduct.image" class="img-fluid" style="max-height: 100%;">
            <div *ngIf="!newProduct.image" class="text-center text-muted">
              <i class="bi bi-image fs-1 d-block mb-1"></i>
              <small class="fw-bold">Image Preview</small>
            </div>
          </div>

          <button type="submit" class="btn w-100 py-2 fw-bold text-white rounded-pill shadow" style="background: linear-gradient(45deg, #d63384, #ff85a1); border: none;">
            <i class="bi bi-plus-circle me-2"></i> SAVE ITEM
          </button>
        </form>
      </div>
    </div>

    <div class="col-md-7">
      <div class="card shadow border-0 rounded-4 overflow-hidden">
        <div class="card-header bg-white py-4 px-4 border-0 border-bottom">
          <h5 class="mb-0 fw-bold"><i class="bi bi-box-seam me-2" style="color: #d63384;"></i> Inventory List</h5>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="bg-light text-muted small text-uppercase">
              <tr>
                <th class="px-4 py-3">Item Info</th>
                <th class="py-3">Category</th>
                <th class="py-3 text-center">Status</th>
                <th class="py-3">Price</th>
                <th class="py-3 text-center">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let p of allProducts">
                <td class="px-4 py-3">
                  <div class="d-flex align-items-center">
                    <img [src]="p.image || 'https://via.placeholder.com/50'" class="rounded-3 me-3 border shadow-sm" style="width: 45px; height: 45px; object-fit: cover;">
                    <div>
                      <span class="fw-bold text-dark d-block">{{ p.name }}</span>
                      <small class="text-muted" *ngIf="p.category === 'Services'">{{p.duration}} mins</small>
                    </div>
                  </div>
                </td>
                <td><span class="small fw-bold text-secondary">{{p.category}}</span></td>
                <td class="text-center">
                  <span *ngIf="p.category === 'Products'" class="badge rounded-pill px-3 py-2" [ngClass]="p.stock > 10 ? 'bg-success bg-opacity-10 text-success' : 'bg-danger bg-opacity-10 text-danger'">
                    {{ p.stock }} left
                  </span>
                  <span *ngIf="p.category === 'Services'" class="badge rounded-pill px-3 py-2 bg-info bg-opacity-10 text-info">Service</span>
                </td>
                <td class="fw-bold text-dark">₹{{ p.price }}</td>
                <td class="text-center">
                  <button class="btn btn-sm btn-outline-danger border-0 rounded-circle p-2" (click)="deleteProduct(p._id)">
                    <i class="bi bi-trash3"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
