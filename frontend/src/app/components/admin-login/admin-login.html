<div class="admin-login-container d-flex justify-content-center align-items-center vh-100" 
     style="background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
            url('https://wallpapers.com/images/hd/hair-salon-background-ocd8o0oatvbqyg39.jpg'); 
            background-size: cover; background-position: center;">
            
  <div class="card p-4 shadow-lg border-0" 
       style="width: 420px; border-radius: 25px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px);">
    
    <div class="card-body text-center">
      <div class="mb-4">
        <div class="rounded-circle bg-success bg-opacity-10 d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
          <i class="bi bi-shield-lock-fill fs-1" style="color: var(--primary-green);"></i>
        </div>
        <h2 class="fw-bold" style="color: var(--primary-green); letter-spacing: 1px;">Admin Access</h2>
        <p class="text-muted small">GLAMOURHUB Management Portal</p>
      </div>

      <form (ngSubmit)="onLogin()">
        <div class="mb-3 text-start">
          <label class="form-label fw-bold small text-muted text-uppercase">Admin Email</label>
          <div class="input-group shadow-sm rounded-pill overflow-hidden">
            <span class="input-group-text bg-light border-0"><i class="bi bi-envelope"></i></span>
            <input type="email" name="email" [(ngModel)]="adminEmail" 
                   class="form-control border-0 bg-light py-2" placeholder="admin@glamourhub.com" required>
          </div>
        </div>
        
        <div class="mb-3 text-start">
          <label class="form-label fw-bold small text-muted text-uppercase">Secret Password</label>
          <div class="input-group shadow-sm rounded-pill overflow-hidden">
            <span class="input-group-text bg-light border-0"><i class="bi bi-key"></i></span>
            <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="adminPassword" 
                   class="form-control border-0 bg-light py-2" placeholder="••••••••" required>
            <span class="input-group-text bg-light border-0 px-3" (click)="togglePassword()" style="cursor: pointer;">
              <i [class]="showPassword ? 'bi bi-eye' : 'bi bi-eye-slash'"></i>
            </span>
          </div>
        </div>

        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-primary btn-lg shadow rounded-pill py-2 fw-bold text-uppercase" 
                  style="letter-spacing: 1px;">
            Login
          </button>
        </div>

        <div class="mt-3">
          <a routerLink="/login" class="text-decoration-none small fw-bold" style="color: var(--primary-green);">
            <i class="bi bi-arrow-left me-1"></i> Back to User Site
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
