<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Marks Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        table {
            width: 50%;
            border-collapse: collapse;
            margin: 50px auto;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #4caf50;
            color: #fff;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th>Subject</th>
        <th>Mark</th>
    </tr>
    <tr>
        <td>Maths</td>
        <td>{{ Maths }}</td>
    </tr>
    <tr>
        <td>Physics</td>
        <td>{{ Physics }}</td>
    </tr>
    <tr>
        <td>Chemistry</td>
        <td>{{ Chemistry }}</td>
    </tr>
    <tr>
        <td>Biology</td>
        <td>{{ Biology }}</td>
    </tr>
    <tr>
        <td>Computer_Science</td>
        <td>{{ Computer_Science }}</td>
    </tr>
    <tr>
        <td>course_name</td>
        <td>{{ course_name }}</td>
    </tr>
</table>

</body>
</html>
