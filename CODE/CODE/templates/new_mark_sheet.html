<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Marks Form</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f8f8;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            width: 400px;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 16px;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            background-color: #4caf50;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Enter Subject Marks</h2>
    <form action="/student_mark" method="post">
        <label for="maths">Maths Mark:</label>
        <input type="number" id="maths" name="maths" required>

        <label for="physics">Physics Mark:</label>
        <input type="number" id="physics" name="physics" required>

        <label for="chemistry">Chemistry Mark:</label>
        <input type="number" id="chemistry" name="chemistry" required>

        <label for="Biology">Biology Mark:</label>
        <input type="number" id="Biology" name="Biology" required>

        <label for="Computer_Science">Computer Science Mark:</label>
        <input type="number" id="Computer_Science" name="Computer_Science" required>
        <button type="submit">Submit</button>
    </form>
</div>

</body>
</html>
