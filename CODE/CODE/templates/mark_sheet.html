<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Marks Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            box-sizing: border-box;
        }

        button {
            background-color: #4caf50;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<form action="/student_mark" method="post">
<div class="container">
    <h2>Enter Subject Marks</h2>
    <form>
        <label for="maths">Maths Mark:</label>
        <input type="number" id="maths" name="maths" required>

        <label for="physics">Physics Mark:</label>
        <input type="number" id="physics" name="physics" required>

        <label for="chemistry">Chemistry Mark:</label>
        <input type="number" id="chemistry" name="chemistry" required>

        <label for="botany">Botany Mark:</label>
        <input type="number" id="botany" name="botany" required>

        <label for="zoology">Zoology Mark:</label>
        <input type="number" id="zoology" name="zoology" required>

        <button type="submit">Submit</button>
    </form>
</div>

</body>
</html>
