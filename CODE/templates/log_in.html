
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  height:100vh;
  width: 100%;
  display:flex;
  justify-content: center;
  flex-direction: column;
  font-family: Arial, Helvetica, sans-serif;
  align-items: center;
}

* {
  margin:0;
  padding:0;
  box-sizing: border-box;
  cursor: pointer;
}
form{
  width: 25rem;
  height:28rem;
  padding: 15px;
  margin: 5px 0 22px 0;
  display: flex;
  flex-direction: column;
  border-left: 1px solid rgba(255, 255, 255, 0.692);
            box-shadow: 3px 3px 5px rgba(86, 60, 231, 0.37);
            border-top: 1px solid rgba(255, 255, 255, 0.678);
            background-color: rgba(246, 248, 248, 0.678);
            border-radius: 30px;

}
h1{
  font-size: 50px;
  text-align: center;
  color:black;
  text-shadow: 2px 2px 4px rgba(0,0,0,.2);
  letter-spacing: 3px;
  margin-bottom: 5%;
  opacity: .7;
}
body{
  background-repeat: no-repeat;
  background-attachment: fixed;
  background-size: cover;
  background-image: url({{url_for('static',filename='class.jpg')}});

}
label
{
  font-size: 20px;
  color: black;
  margin-left: 10%;
  opacity: .8;
  text-shadow: 2px 2px 4px rgba(0,0,0,.2);
}
input
{
  text-align: center;
  width: 80%;
  margin: 8% auto;
  font-size: 20px;
  margin-bottom: 10% auto;
  margin-top: 20% auto;
  border: none;
  outline: none;
  background: transparent;
  color: black;
  border-bottom: 1px solid rgba(5, 0, 0, 0.6);
  opacity: .8;
}

/* Set a style for the submit button */
.registerbtn {
  width: 50%;
  margin: 3px auto;
  color: white;
  font-size: 15px;
  background:blue;
  padding: 10px 30px ;
  border: none;
  outline: none;
  border-radius: 20px;
  text-shadow:2px 2px 4px rgba(0,0,0,.2);
  box-shadow: 3px 3px 5px rgba(247, 2, 124, 0.37);
  border-left: 1px solid rgba(255,255,255,.3);
  border-top: 1px solid rgba(255,255,255,.3);
  position:sticky;
} 
.registerbtn:hover {
            background-color:rgb(102, 38, 250);
        }
        a {
  text-decoration: none;
  display: inline-block;
  padding: 8px 16px;
}

a:hover {
  background-color: #ddd;
  color: black;
}
.previous {
  background-color: #f1f1f1;
  color: black;
}
.round {
  border-radius: 50%;
}

</style>
</head>
<title>LOGIN</title>
<body>
  <a onclick="history.back()" class="previous round">&#8249;</a>
<form action="/log_in_parameters" method="post">
  <div>
    <p><center><h1>Login</h1></center></p>
    <hr>
    <br>

    <label for="mobilenumber"><b>Mobile Number</b></label>
   <input type="text" placeholder="Mobile Number" name="mobilenumber" id="mobilenumber" required>

    <label for="psw"><b>Password</b></label>
    <input type="password" placeholder="Enter Password"  name="psw" id="myInput">
   
    <script>
      function myFunction() {
        var x = document.getElementById("myInput");
        if (x.type === "password") {
          x.type = "text";
        } else {
          x.type = "password";
        }
      }
    </script>

    <hr>
    <br>

   <center> <button type="submit" class="registerbtn">Login</button></center>
  </div>
  
</form>

</body>
</html>
