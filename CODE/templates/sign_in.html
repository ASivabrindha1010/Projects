

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGN IN</title>
<style>
body {
  height:100vh;
  width: 100%;
  display:flex;
  justify-content: center;
  flex-direction: column;
  font-family: Arial, Helvetica, sans-serif;
  align-items: center;
}

* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  cursor: pointer;
}
form{
  width:31.25rem;
  height:40rem;
  padding: 15px;
  margin: 5px 0 22px 0;
  flex-direction: column;
}
h1{
  font-size: 50px;
  text-align: center;
  color: black;
  text-shadow: 2px 2px 4px rgba(212, 157, 157, 0.2);
  letter-spacing: 3px;
  margin-bottom: 5%;
  opacity: .7;
}
label
{
  font-size: 20px;
  color:black;
  margin-left: 10%;
  opacity: .8;
  text-shadow: 2px 2px 4px rgba(173, 149, 149, 0.411);
}
input
{
  text-align: center;
  width: 80%;
  margin: 8% auto;
  font-size: 20px;
  margin-bottom: 10% auto;
  margin-top: 20% auto;
  border: none;
  outline: none;
  background: transparent;
  color:black;
  border-bottom: 1px solid rgba(255, 255,255,0.6);
  opacity: .8;
}

/* Set a style for the submit button */
.registerbtn {
  width: 50%;
  margin: 3px auto;
  color: rgba(255, 255,255,0.6);;
  font-size: 15px;
  background:blue;
  padding: 10px 30px ;
  border: none;
  outline: none;
  border-radius: 20px;
  text-shadow:2px 2px 4px rgba(201, 178, 178, 0.37);
  box-shadow: 3px 3px 5px rgba(28, 59, 235, 0.37);
  border-left: 1px solid rgba(255,255,255,.3);
  border-top: 1px solid rgba(255,255,255,.3);
  position:sticky;
} 
.registerbtn:hover {
            background-color:rgb(91, 81, 240);
        }
body{
  background-repeat: no-repeat;
  background-attachment: fixed;
  background-size: cover;
  background-image: url({{url_for('static',filename='sign.jpg')}});

}
.signin {
  background-color: blue;
  text-align: center;
  background-color: rgba(255, 255,255,0.6);;
}
h2{
  text-align: center;
  line-height:30px; 
  margin-bottom:50px;
  color:black;
}
.container {
  max-width: 100%;
  width: 100%;
  background:rgba(255, 255,255,0.06);
  padding: 16px;
  border-left: 1px solid rgba(255, 255, 255, 0.692);
            box-shadow: 3px 3px 5px rgba(86, 60, 231, 0.37);
            border-top: 1px solid rgba(255, 255, 255, 0.678);
            background-color: rgba(246, 248, 248, 0.678);
  border-radius: 5px;
}
a {
  text-decoration: none;
  display: inline-block;
  padding: 8px 16px;
}

a:hover {
  background-color: #ddd;
  color: black;
}
.previous {
  background-color: #f1f1f1;
  color: black;
}
.round {
  border-radius: 50%;
}
</style>
</head>
<body>

<form action="/sign_in_parameters"method="post">
  <a onclick="history.back()" class="previous round">&#8249;</a>

  <div class ="container">
    <h1>Register</h1>
    <label for="Name"><b>Name</b></label>
    <input type="text" placeholder="Name" name="name" id="name" required>

    <label for="mobilenumber"><b>Mobile Number</b></label>
    <input type="text" placeholder="Mobile Number" name="mobilenumber" id="mobilenumber" required>

    <label for="psw"><b>Password</b></label>
    <input type="password" placeholder="Enter Password" name="psw" id="psw" required>

    <label for="psw-repeat"><b>Confirm Password</b></label>
    <input type="password" placeholder="Confirm Password" name="psw-repeat" id="psw-repeat" required>


    <center><button type="submit" class="registerbtn">Register</button></center>
  
  <div class="container signin">
    <p>Already have an account? <a href="log_in_details">log in</a>.</p>
  </div>
</form>

</body>
</html>
